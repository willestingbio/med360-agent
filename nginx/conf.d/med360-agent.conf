# ── med360-agent.conf — Virtual Host ─────────────────
# Medicamentum360 Agent — n8n + Knowledge API + Widget

upstream n8n_backend {
    server n8n:5678;
}

upstream knowledge_api {
    server knowledge-api:8001;
}

server {
    listen 80;
    server_name ${DOMAIN};

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir a HTTPS en producción
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # ── Widget demo page ──────────────────────────────
    location /widget {
        alias /usr/share/nginx/html/widget;
        try_files $uri $uri/ /widget/dr-medici-demo.html;
        index dr-medici-demo.html;
    }

    # ── n8n Webhook (chat endpoint) ──────────────────
    location /webhook/ {
        limit_req zone=chat burst=10 nodelay;
        proxy_pass http://n8n_backend/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ── n8n Editor UI ────────────────────────────────
    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://n8n_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ── Knowledge API ────────────────────────────────
    location /api/knowledge/ {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://knowledge_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Health check ─────────────────────────────────
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
