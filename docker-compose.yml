services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicalmen
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
