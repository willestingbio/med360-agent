# ── Docker Compose — medicalMen (med360-agent) ────────
# Producción: Nginx reverse proxy en puerto 80 + Gradio app en 7860
# Local: docker compose up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicalmen
    restart: unless-stopped
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - PORT=7860
    networks:
      - med360-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860')"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: medicalmen-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - med360-net
    depends_on:
      - app

networks:
  med360-net:
    driver: bridge
