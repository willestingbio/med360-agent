# ── Docker Compose — medicalMen (med360-agent) ────────
# Para OCI / producción: docker compose up -d
# Para local: docker compose up -d app

services:
  # ─── Gradio App — medicalMen ──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicalmen
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - PORT=7860
    networks:
      - med360-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  med360-net:
    driver: bridge
